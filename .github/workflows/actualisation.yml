name: Actualisation BRVM

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * 1-5'

permissions:
  contents: write

jobs:
  actualisation:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer actualisation BRVM
        run: python actualiser_brvm.py

      - name: Sauvegarder les nouvelles donnees
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees_brvm/
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation quotidienne des donnees BRVM"
            git push
          else
            echo "Aucune nouvelle donnee a sauvegarder."
          fi
