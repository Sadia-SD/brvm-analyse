name: Actualisation BRVM

on:
  workflow_dispatch:

jobs:
  actualisation:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer actualisation BRVM
        run: python actualiser_brvm.py
