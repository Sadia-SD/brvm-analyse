
name: Actualisation BRVM

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

permissions:
  contents: write

jobs:
  actualisation:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer actualisation BRVM
        run: python actualiser_brvm.py

      - name: Sauvegarder les nouvelles donnees sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees_brvm/
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation quotidienne des donnees BRVM"
            git push
          else
            echo "Aucune nouvelle donnee a sauvegarder."
          fi

      - name: Envoyer les CSV vers SharePoint
        env:
          POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
        run: |
          python - <<'PY'
          import os
          import base64
          from pathlib import Path
          import requests

          url = os.environ.get("POWER_AUTOMATE_URL")

          if not url:
              raise RuntimeError("Le secret POWER_AUTOMATE_URL est absent.")

          racine = Path("donnees_brvm")

          for dossier in ("brutes", "propres", "historique"):
              chemin = racine / dossier

              if not chemin.exists():
                  continue

              for fichier in sorted(chemin.glob("*.csv")):
                  payload = {
                      "fileName": fichier.name,
                      "folder": dossier,
                      "contentBase64": base64.b64encode(
                          fichier.read_bytes()
                      ).decode("ascii")
                  }

                  response = requests.post(
                      url,
                      json=payload,
                      timeout=120
                  )

                  print(
                      f"{dossier}/{fichier.name} : "
                      f"HTTP {response.status_code}"
                  )

                  response.raise_for_status()

          print("Transfert SharePoint terminé.")
          PY
